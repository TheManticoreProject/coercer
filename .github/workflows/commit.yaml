name: Build on commit

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  test:
    name: Vet and Test
    runs-on: ubuntu-latest

    env:
      GO111MODULE: 'on'
      CGO_ENABLED: '0'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  build:
    name: Build Release Assets
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64, 386]
        binaryname: [coercer]
        # Exclude incompatible couple of GOOS and GOARCH values
        exclude:
          - os: darwin
            arch: 386

    env:
      GO111MODULE: 'on'
      CGO_ENABLED: '0'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          ls -lha
          OUTPUT_PATH="build/${{ matrix.binaryname }}-${{ matrix.os }}-${{ matrix.arch }}"
          # Build the binary
          go build -ldflags="-s -w" -o $OUTPUT_PATH${{ matrix.os == 'windows' && '.exe' || '' }}
